name: Compliance

on:
  pull_request: {}

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt install clang-format
      - name: Check Formatting Style (clang-format)
        run: |
          sh ./scripts/check_format.sh origin/${{ github.base_ref }}
