name: System Test

on:
  push:
    branches:
      - master
  pull_request: {}

jobs:
  simple:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Execute tests
        run: |
          docker compose up -d
          ./scripts/wait_for.sh 'docker logs ptpd-slave 2>&1 | grep -q "# Timestamp"' 120
          ./scripts/wait_for.sh 'docker logs ptpd-slave-freertos 2>&1 | grep -q "# Timestamp"' 120
