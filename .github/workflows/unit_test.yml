name: Unit Test

on:
  push: {}
  pull_request: {}

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt install cmake ninja

      - name: Build and run unit tests
        run: |
          cmake --preset ut
          cmake --build --preset
          ctest --preset ut
